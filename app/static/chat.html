<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>多Agent协同助手</title>
  <style>
    :root {
      --bg: #eef2f6;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --line: #d9dee7;
      --accent: #1f7a8c;
      --accent-dark: #145c6a;
      --user: #e7f3ff;
      --assistant: #ffffff;
      --danger: #b42318;
      --ok: #067647;
      --warn: #b54708;
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }

    header {
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.95);
      border-bottom: 1px solid var(--line);
      padding: 16px 22px;
      z-index: 2;
      backdrop-filter: blur(8px);
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.9fr);
      gap: 16px;
      padding: 16px;
      max-width: 1600px;
      margin: 0 auto;
      height: calc(100vh - 74px);
      overflow: hidden;
    }

    .panel, .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .panel {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
    }

    .panel-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
    }

    .chat-stream {
      flex: 1;
      overflow: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(180deg, #f9fbfd 0%, #f2f6fa 100%);
    }

    .bubble {
      max-width: 84%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.55;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--user);
      border-color: #cde2ff;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: var(--assistant);
    }

    .bubble.system {
      align-self: center;
      max-width: 95%;
      background: #f8fafc;
      color: var(--muted);
      border-style: dashed;
      font-size: 13px;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 14px;
      display: grid;
      gap: 10px;
      background: #fff;
    }

    .composer textarea, .composer input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      color: var(--text);
      background: #fff;
    }

    .composer textarea {
      min-height: 88px;
      resize: vertical;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 9px 14px;
      min-height: 38px;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: white;
    }
    button.secondary {
      background: white;
      color: var(--accent-dark);
      border-color: var(--accent);
    }
    button.danger {
      background: white;
      color: var(--danger);
      border-color: #f0b8b2;
    }
    button.small {
      padding: 6px 10px;
      min-height: 30px;
      font-weight: 700;
      border-radius: 8px;
    }
    button.ghost {
      background: white;
      color: var(--accent-dark);
      border-color: var(--line);
    }

    .side {
      display: grid;
      grid-template-rows: 0.85fr 0.75fr 1.4fr;
      gap: 16px;
      min-height: 0;
      height: 100%;
    }

    .card {
      padding: 14px;
      overflow: auto;
      min-height: 0;
    }

    .card-title {
      padding: 0 0 10px;
      margin: 0 0 10px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
    }

    .grid {
      display: grid;
      gap: 10px;
    }

    .kv {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfe;
    }
    .kv span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .kv strong { display: block; overflow-wrap: anywhere; }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 700;
      background: #e8f3f6;
      color: var(--accent-dark);
    }
    .chip.ok { background: #dcfae6; color: var(--ok); }
    .chip.warn { background: #fff1d6; color: var(--warn); }
    .chip.danger { background: #ffe4e0; color: var(--danger); }

    .alert {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
      margin-top: 10px;
    }
    .alert.danger {
      border-color: #f0b8b2;
      background: #ffe4e0;
      color: #7a271a;
    }
    .alert.warn {
      border-color: #f5d0a5;
      background: #fff1d6;
      color: #7a2e0e;
    }
    .alert.info {
      border-color: #c7d7fe;
      background: #eef4ff;
      color: #1d3b8f;
    }
    .alert summary {
      cursor: pointer;
      font-weight: 700;
    }
    .hidden { display: none; }

    .mini-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .mini-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }

    .muted { color: var(--muted); }
    .mono { font-family: Consolas, "Courier New", monospace; overflow-wrap: anywhere; }

    .confirm-box {
      border: 1px solid #f5c542;
      background: #fff9ea;
      border-radius: 8px;
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .confirm-title {
      font-weight: 700;
    }

    @media (max-width: 1100px) {
      main { grid-template-columns: 1fr; }
      .bubble { max-width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>多Agent协同助手</h1>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head">自然语言交互</div>
      <div id="chatStream" class="chat-stream"></div>
      <div class="composer">
        <input id="taskId" placeholder="root_task_id，可留空，首次输入自然语言会创建任务" class="mono" />
        <textarea id="messageInput" placeholder="例如：帮我对 http://web1.demotech.local 做一次授权演练；或输入：批准继续 / 拒绝"></textarea>
        <div class="actions">
          <button id="sendBtn">发送</button>
          <button id="approveBtn" class="secondary">批准当前高危动作</button>
          <button id="rejectBtn" class="danger">拒绝当前高危动作</button>
        </div>
      </div>
    </section>

    <div class="side">
      <section class="card">
        <div class="card-title">任务概览</div>
        <div class="grid">
          <div class="kv"><span>状态</span><strong id="taskStatus">-</strong></div>
          <div class="kv"><span>当前步骤</span><strong id="taskStep">-</strong></div>
          <div class="kv"><span>目标</span><strong id="taskTarget">-</strong></div>
          <div class="kv"><span>待确认动作</span><strong id="taskPending">-</strong></div>
        </div>
      </section>

      <section class="card">
        <div class="card-title">高危确认</div>
        <div id="confirmBox" class="confirm-box">
          <div class="confirm-title">暂无待确认动作</div>
          <div class="muted">流程遇到高风险步骤时，会在这里显示确认卡片。</div>
        </div>
      </section>

      <section class="card">
        <div class="card-title">最新结果</div>
        <div class="mini-list" id="resultList"></div>
      </section>
    </div>
  </main>

  <script>
    const state = {
      root_task_id: "",
      task: null,
      pending_approval: null,
      approvals: [],
      events: [],
      findings: [],
      artifacts: [],
      report: null,
    };

    const agentNames = {
      web_pentest: "Web渗透Agent",
      web_reverify: "Web渗透Agent",
      code_audit: "代码审计Agent",
      social_engineering: "社会工程Agent",
    };

    const actionNames = {
      code_audit: "代码审计Agent：对 Web渗透Agent 发现的源码快照进行代码审计",
      web_reverify: "Web渗透Agent：根据代码审计结果进行 Web 二次验证",
      social_engineering: "社会工程Agent：分析目标并生成目标选择建议",
      email_generation: "社会工程Agent：根据已确认目标生成邮件草稿",
      gophish_create: "社会工程Agent：创建 Gophish 演练活动",
      mail_send: "社会工程Agent：发送授权演练邮件",
    };

    const $ = (id) => document.getElementById(id);

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function bubble(kind, title, content) {
      const div = document.createElement("div");
      div.className = `bubble ${kind}`;
      div.innerHTML = title ? `<strong>${escapeHtml(title)}</strong><br>${escapeHtml(content)}` : escapeHtml(content);
      $("chatStream").appendChild(div);
      $("chatStream").scrollTop = $("chatStream").scrollHeight;
    }

    function setConfirmBox(item) {
      const el = $("confirmBox");
      if (!item) {
        el.innerHTML = `
          <div class="confirm-title">暂无待确认动作</div>
          <div class="muted">流程遇到高风险步骤时，会在这里显示确认卡片。</div>
        `;
        return;
      }
      const actionText = actionNames[item.action_type] || item.action_type;
      el.innerHTML = `
        <div class="confirm-title">需要确认：${escapeHtml(actionText)}</div>
        <div class="muted">状态：${escapeHtml(item.status)}</div>
        <div class="mono">${escapeHtml(item.id)}</div>
        <div class="muted">${escapeHtml(item.decision_comment || item.decision_by || "等待确认")}</div>
      `;
    }

    async function request(path, options = {}) {
      const resp = await fetch(path, {
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options,
      });
      if (!resp.ok) {
        const text = await resp.text();
        throw new Error(`${resp.status} ${resp.statusText}: ${text}`);
      }
      return resp.json();
    }

    async function sendMessage() {
      const message = $("messageInput").value.trim();
      if (!message) return;
      const root_task_id = $("taskId").value.trim() || null;
      bubble("user", "", message);
      $("messageInput").value = "";

      const payload = {
        message,
        root_task_id,
        created_by: "operator",
      };
      const data = await request("/api/chat/message", {
        method: "POST",
        body: JSON.stringify(payload),
      });
      if (data.root_task_id) {
        $("taskId").value = data.root_task_id;
        state.root_task_id = data.root_task_id;
      }
      renderResponse(data);
    }

    async function respondDecision(decisionText) {
      const root_task_id = $("taskId").value.trim();
      if (!root_task_id) {
        bubble("system", "", "请先创建或加载一个任务。");
        return;
      }
      const data = await request("/api/chat/message", {
        method: "POST",
        body: JSON.stringify({
          message: decisionText,
          root_task_id,
          created_by: "operator",
        }),
      });
      renderResponse(data);
    }

    function renderResponse(data) {
      bubble("assistant", "调度器", data.reply || "已处理。");
      state.root_task_id = data.root_task_id || state.root_task_id;
      state.task = data.task || state.task;
      state.pending_approval = data.pending_approval || null;
      state.approvals = data.approvals || state.approvals;
      state.events = data.events || state.events;
      state.findings = data.findings || state.findings;
      state.artifacts = data.artifacts || state.artifacts;
      state.report = data.report || state.report;
      renderSide();
      renderResults();
      setConfirmBox(state.pending_approval);
    }

    function renderSide() {
      const task = state.task || {};
      const statusClass = task.status === "completed" ? "ok" : task.status === "waiting_approval" ? "warn" : task.status === "rejected" ? "danger" : "";
      const statusText = task.status === "waiting_approval" ? "等待审批" : task.status === "completed" ? "已完成" : task.status === "rejected" ? "已拒绝" : (task.status || "-");
      $("taskStatus").innerHTML = `<span class="chip ${statusClass}">${escapeHtml(statusText)}</span>`;
      $("taskStep").textContent = task.current_step ? `${task.current_step}（${stepLabel(task.current_step)}）` : "-";
      $("taskTarget").textContent = task.target_url || "-";
      $("taskPending").textContent = state.pending_approval ? (actionNames[state.pending_approval.action_type] || state.pending_approval.action_type) : "-";
    }

    function stepLabel(step) {
      const map = {
        web_initial_scan: "Web初扫",
        approval_code_audit: "代码审计（确认）",
        code_audit: "代码审计",
        approval_web_reverify: "Web二次验证（确认）",
        web_reverify: "Web二次验证",
        social_context_review: "社会工程上下文审查",
        approval_social_context: "补充社会工程上下文（确认）",
        approval_social_engineering: "社会工程目标分析（确认）",
        social_target_analysis: "社会工程目标分析",
        approval_email_generation: "邮件草稿生成（确认）",
        social_email_generation: "邮件草稿生成",
        approval_gophish_create: "Gophish活动创建（确认）",
        gophish_create: "Gophish活动创建",
        approval_mail_send: "邮件发送（确认）",
        gophish_send: "邮件发送",
        collect_exercise_results: "结果汇总",
        build_report: "生成报告",
        completed: "已完成",
      };
      return map[step] || step || "-";
    }

    function severityRank(sev) {
      const v = String(sev || "info").toLowerCase();
      if (v === "critical") return 4;
      if (v === "high") return 3;
      if (v === "medium") return 2;
      if (v === "low") return 1;
      return 0;
    }

    function renderResults() {
      const blocks = [];

      let latestAgentTaskId = "";
      let latestAgentType = "";
      for (let i = state.events.length - 1; i >= 0; i--) {
        const ev = state.events[i] || {};
        if (ev.event_type !== "agent_task_completed") continue;
        const payload = ev.payload || {};
        latestAgentTaskId = payload.agent_task_id || "";
        const msg = String(ev.message || "");
        latestAgentType = msg.replace(" completed", "").trim();
        break;
      }

      const gatewayFallback = (state.events || []).slice().reverse().find((e) => e && e.event_type === "agent_gateway_call_fallback");
      if (gatewayFallback) {
        const p = gatewayFallback.payload || {};
        const baseUrl = p.base_url || "-";
        const msg = p.error_message || p.error_type || "unknown";
        blocks.push(`
          <div class="alert danger">
            <div><strong>外部 Agent 调用失败</strong></div>
            <div class="mono">Phishing Agent：${escapeHtml(baseUrl)}</div>
            <div class="muted">已自动切换至本地模拟结果，演练将继续进行（功能受限）。</div>
            <div class="mono">${escapeHtml(msg)}</div>
          </div>
        `);
      }

      const findings = state.findings || [];
      if (findings.length) {
        const shown = findings.slice(-20);
        const high = shown.filter((f) => severityRank(f.severity) >= 3);
        const medium = shown.filter((f) => severityRank(f.severity) === 2);
        const info = shown.filter((f) => severityRank(f.severity) <= 1);
        const line = (f) => escapeHtml(`- 【${agentNames[f.source] || f.source}】[${f.severity}] ${f.title}：${f.detail}`);
        if (high.length) {
          blocks.push(`
            <div class="alert danger">
              <div><strong>高危/严重发现（必须阅读）</strong></div>
              <div class="mono">${high.map(line).join("<br>")}</div>
            </div>
          `);
        }
        if (medium.length) {
          blocks.push(`
            <details class="alert warn">
              <summary>中危发现（${medium.length} 条，可展开）</summary>
              <div class="mono">${medium.map(line).join("<br>")}</div>
            </details>
          `);
        }
        if (info.length) {
          blocks.push(`
            <details class="alert info">
              <summary>信息级发现（${info.length} 条，默认隐藏）</summary>
              <div class="mono">${info.map(line).join("<br>")}</div>
            </details>
          `);
        }
      }

      const artifacts = state.artifacts || [];
      const stepArtifacts = latestAgentTaskId ? artifacts.filter((a) => String(a.agent_task_id || "") === String(latestAgentTaskId)) : [];
      const shownArtifacts = stepArtifacts.length ? stepArtifacts : artifacts;
      if (shownArtifacts.length) {
        const header = stepArtifacts.length
          ? `本步产物（${agentNames[latestAgentType] || latestAgentType || "子Agent"} / ${shownArtifacts.length}）`
          : `产物（共 ${shownArtifacts.length}）`;
        blocks.push(`
          <div class="mini-item">
            <div><strong>${escapeHtml(header)}</strong></div>
            <div class="muted mono">${shownArtifacts.map((a) => {
              const meta = a.artifact_metadata || {};
              const metaPreview = a.artifact_type === "mail_draft"
                ? `草稿数：${Array.isArray(meta.drafts) ? meta.drafts.length : 0}`
                : a.artifact_type === "gophish_campaign_draft"
                  ? `目标数：${meta.target_count ?? "-"}，邮件数：${meta.mail_count ?? "-"}`
                  : JSON.stringify(meta).slice(0, 240);
              const rid = `artifact_ref_${String(a.id || Math.random()).replaceAll("-", "_")}`;
              const btnText = `查看${a.title || a.artifact_type}`;
              return `
                <div style="margin-top:8px">
                  ${escapeHtml(`- [${a.artifact_type}] ${a.title || "-"}`)}
                  <button class="small ghost" data-ref-target="${escapeHtml(rid)}">${escapeHtml(btnText)}</button>
                  <div id="${escapeHtml(rid)}" class="mono hidden">${escapeHtml(a.artifact_ref || "")}</div>
                  <div class="muted">${escapeHtml(metaPreview)}</div>
                </div>
              `;
            }).join("")}</div>
          </div>
        `);
      }

      const events = state.events || [];
      if (events.length) {
        const shown = events.slice(-10);
        blocks.push(`
          <details class="mini-item">
            <summary><strong>事件（最近 ${shown.length}/${events.length}）</strong></summary>
            <div class="muted mono" style="margin-top:8px">${shown.map((e) => escapeHtml(`- ${e.event_type}: ${e.message}`)).join("<br>")}</div>
          </details>
        `);
      }

      if (state.report) {
        blocks.push(`
          <div class="mini-item">
            <div><strong>报告已生成</strong></div>
            <div class="muted mono">${escapeHtml(state.report.summary ? JSON.stringify(state.report.summary) : "report ready")}</div>
          </div>
        `);
      }

      $("resultList").innerHTML = blocks.length ? blocks.join("") : `<div class="muted">暂无结果</div>`;
    }

    $("resultList").addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-ref-target]");
      if (!btn) return;
      const target = btn.dataset.refTarget || "";
      const el = target ? document.getElementById(target) : null;
      if (!el) return;
      el.classList.toggle("hidden");
    });

    $("sendBtn").addEventListener("click", () => sendMessage().catch((err) => bubble("system", "", err.message)));
    $("approveBtn").addEventListener("click", () => respondDecision("批准继续").catch((err) => bubble("system", "", err.message)));
    $("rejectBtn").addEventListener("click", () => respondDecision("拒绝").catch((err) => bubble("system", "", err.message)));
    $("messageInput").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && !ev.shiftKey) {
        ev.preventDefault();
        sendMessage().catch((err) => bubble("system", "", err.message));
      }
    });

    bubble("system", "", "可以直接输入自然语言，例如：帮我对 http://web1.demotech.local 做一次授权演练。遇到高危动作时，右侧会显示确认卡片。");
  </script>
</body>
</html>
